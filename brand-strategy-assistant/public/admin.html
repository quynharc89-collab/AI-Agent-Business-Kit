<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Brand Strategy Assistant</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header"><h1>Admin — Cấp tài khoản / cộng lượt</h1></header>
    <main class="stage active">
      <form id="admin-form">
        <label>Admin secret
          <input type="password" name="secret" required />
        </label>
        <label>Hành động
          <select name="action">
            <option value="view">Xem tài khoản</option>
            <option value="create">Tạo tài khoản mới</option>
            <option value="credit">Cộng lượt (+N)</option>
            <option value="delete">Xoá tài khoản (cẩn thận!)</option>
          </select>
        </label>
        <label>Email khách
          <input type="email" name="email" required placeholder="khach@email.com" />
        </label>
        <label>SĐT khách (cần khi tạo mới)
          <input type="text" name="phone" placeholder="0912345678" />
        </label>
        <label>Họ tên (khi tạo mới)
          <input type="text" name="name" placeholder="Tên khách" />
        </label>
        <label>Số lượt (khi tạo/cộng — mặc định 1)
          <input type="number" name="credits" value="1" min="1" max="20" />
        </label>
        <button type="submit" class="btn-primary">Thực hiện</button>
      </form>
      <pre id="admin-result" style="background:#f5f5f5;padding:12px;border-radius:8px;white-space:pre-wrap;font-size:12px;margin-top:16px"></pre>
    </main>
  </div>
<script>
document.getElementById('admin-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  if (fd.get('action') === 'delete' && !confirm('Xoá vĩnh viễn tài khoản ' + fd.get('email') + ' và file đã tạo?')) return;
  const res = await fetch('/api/admin', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-admin-secret': fd.get('secret') },
    body: JSON.stringify({
      action: fd.get('action'),
      email: fd.get('email'),
      phone: fd.get('phone'),
      name: fd.get('name'),
      credits: Number(fd.get('credits')) || 1,
    }),
  });
  const data = await res.json();
  document.getElementById('admin-result').textContent = JSON.stringify(data, null, 2);
});
</script>
</body>
</html>
